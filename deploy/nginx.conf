# Nginx config cho kesbie.com (Astro static, sau Cloudflare Tunnel -> nginx :8080)
# Copy file này vào server, ví dụ /data/data/com.termux/files/usr/etc/nginx/conf.d/kesbie.com.conf
# rồi `nginx -t && nginx -s reload`.

server {
    listen 8080;
    server_name kesbie.com www.kesbie.com;

    root /data/data/com.termux/files/home/sites/kesbie.com/dist;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain text/xml;

    # Sau Cloudflare Tunnel: redirect phải là tương đối, nếu không nginx sẽ sinh
    # "http://kesbie.com:8080/en/" (lộ port nội bộ và sai scheme).
    absolute_redirect off;

    # Trả 404 thật cho path không tồn tại (trước đây fallback /index.html làm mọi
    # path đều 200 -> Google coi là soft 404, Lighthouse báo llms.txt/ard.json lỗi).
    error_page 404 /404.html;

    # Nén: HTML đã inline CSS nên giảm được ~65%.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Asset có hash trong tên -> cache vĩnh viễn.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # robots.txt / llms.txt phải là text/plain, nếu không crawler không parse được.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /.well-known/ard.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/(sitemap.*\.xml|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~* \.(png|ico|svg|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # /en -> /en/ để không lộ "http://kesbie.com:8080/en/" trong Location header.
    location = /en {
        return 301 /en/;
    }

    location / {
        # $uri/ phục vụ thư mục có trailing slash. Thay /index.html bằng =404
        # để path lạ trả 404 đúng thay vì HTML trang chủ.
        try_files $uri $uri/ =404;
    }
}
